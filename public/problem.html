<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>题目详情 - 设计模式刷题平台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="problem-page">
  <div class="bg-effects">
    <div class="aurora"></div>
    <div class="spotlight"></div>
    <div class="background-grid"></div>
  </div>
  <header class="topbar">
    <div class="brand"><span class="logo">设</span>设计模式刷题平台</div>
    <nav class="topnav">
      <a href="/">题目列表</a>
      <a href="#" id="nav-prev" class="ghost-btn">‹ 上一题</a>
      <a href="#" id="nav-next">下一题 ›</a>
    </nav>
  </header>

  <div class="problem-layout">
    <section class="panel-left" id="description">加载中…</section>

    <section class="panel-right">
      <div class="editor-toolbar">
        <select id="language">
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="go">Go</option>
          <option value="javascript">JavaScript</option>
        </select>
        <button class="btn primary" id="btn-run" disabled>运行</button>
        <button class="btn success" id="btn-submit" disabled>提交</button>
        <button class="btn" id="btn-submissions" disabled title="查看这道题你已通过的历史提交代码与测试结果">提交记录</button>
        <button class="btn" id="btn-solution" disabled>查看答案</button>
        <button class="btn" id="btn-restore" hidden title="回到查看答案前我自己的代码">返回我的代码</button>
        <button class="btn" id="btn-reset" disabled title="丢弃当前草稿，恢复初始模板">重置</button>
        <span class="spacer"></span>
        <button class="btn icon-btn" id="btn-wrap" title="切换软换行（长代码自动折行）">自动换行：关</button>
        <button class="btn icon-btn" id="btn-comment" title="注释 / 取消注释选中行（Alt+/）">注释</button>
        <span class="run-info" id="solve-badge"></span>
      </div>

      <div class="editor-wrap">
        <div id="code-editor" class="ced-host"></div>
        <div class="editor-status">
          <span id="save-status" class="save-status"></span>
          <span id="editor-status"></span>
        </div>
      </div>

      <div class="io-panel">
        <div class="io-head">
          <label>输入</label>
          <textarea id="input" placeholder="自定义输入（默认使用第一个示例）" spellcheck="false"></textarea>
          <span class="io-hint" id="input-hint"></span>
        </div>
        <div class="console" id="output">在这里查看运行 / 提交结果。</div>
      </div>
    </section>
  </div>

  <div class="modal-overlay hidden" id="submissions-modal">
    <div class="modal">
      <div class="modal-head">
        <h3>已通过的提交记录</h3>
        <button class="btn icon-btn" id="subs-close" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="subs-list" id="subs-list"></div>
        <div class="subs-detail hidden" id="subs-detail">
          <div class="subs-detail-head">
            <button class="btn ghost" id="subs-back">‹ 返回列表</button>
            <span id="subs-detail-meta"></span>
          </div>
          <div class="subs-detail-code">
            <div class="subs-code-head"><span id="subs-code-lang"></span><span id="subs-code-time"></span></div>
            <pre id="subs-code"></pre>
          </div>
          <div class="subs-detail-results" id="subs-results"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/editor-lexer.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/problem.js"></script>
</body>
</html>
